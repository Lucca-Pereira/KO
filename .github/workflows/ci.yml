name: CI

on:
  push:
    branches: [ main, rework ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The migration tests run under Robolectric in src/test precisely so this step executes
      # them. They are the only thing standing between a schema change and someone's pantry.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Check the exported schema is committed
        # A schema JSON that was generated but never committed is invisible until months later,
        # when the migration test for that version turns out to be impossible to write.
        run: |
          ./gradlew :app:kspDebugKotlin --stacktrace
          if ! git diff --quiet -- app/schemas; then
            echo "::error::app/schemas is out of date. Run ./gradlew :app:kspDebugKotlin and commit the result."
            git --no-pager diff --stat -- app/schemas
            exit 1
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/ko-kitchen-${GITHUB_REF_NAME}.apk"
          else
            cp app/build/outputs/apk/release/app-release.apk "dist/ko-kitchen-latest.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ko-kitchen-apk
          path: dist/*.apk

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
